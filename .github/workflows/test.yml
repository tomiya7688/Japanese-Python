name: Specification and reference-tool tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference tooling
        run: python -m pip install -e .
      - name: Verify JPy specification examples and both tool modes
        run: python -m unittest discover -s tests -v
      - name: Standalone generated Python smoke test
        run: |
          jpy compile examples/hello.jpy -o build/hello.py
          python build/hello.py
          jpy run examples/hello.jpy
